<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yljandi - Sána</title>
  <meta name="description" content="Leiddar sánu gusur (saunagus) sem sameina hita, nærveru, slökun og endurnæringu.">

  <link rel="icon" type="image/png" href="img/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main>
    <header class="hero">
      <img class="hero__logo" src="img/logo.png" alt="Yljandi merki">
      <h1 class="hero__name">Yljandi <span class="hero__sep">·</span> Sána</h1>
      <p class="hero__tagline">Leiddar sánu gusur (saunagus) sem sameina hita, nærveru, slökun og endurnæringu.</p>
    </header>

    <section class="ritual" aria-label="Um sánuna">
      <svg class="brushstroke" viewBox="0 0 200 10" preserveAspectRatio="none" aria-hidden="true">
        <path d="M 5 6 Q 55 1, 100 5 T 195 5" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" fill="none"/>
      </svg>

      <p class="ritual__words">
        <span class="ritual__pair">
          <span>Hiti</span>
          <span class="ritual__dot" aria-hidden="true">·</span>
          <span>Nærvera</span>
        </span>
        <span class="ritual__dot ritual__dot--between" aria-hidden="true">·</span>
        <span class="ritual__pair">
          <span>Slökun</span>
          <span class="ritual__dot" aria-hidden="true">·</span>
          <span>Endurnæring</span>
        </span>
      </p>
    </section>

    <svg class="brushstroke" viewBox="0 0 200 10" preserveAspectRatio="none" aria-hidden="true">
      <path d="M 5 5 Q 70 9, 110 5 T 195 6" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" fill="none"/>
    </svg>

    <section id="vidburdir" class="events">
      <h2 class="events__title">Komandi viðburðir</h2>
      <div class="events__list" id="events-list">
        <p class="events__loading">Hleð viðburðum …</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <a class="footer__link" href="https://facebook.com/yljandi" target="_blank" rel="noopener">facebook.com/yljandi</a>
    <p class="footer__note">Yljandi · Sána</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
